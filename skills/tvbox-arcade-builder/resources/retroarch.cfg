# RetroArch base config for RK3229/RK322x arcade cabinets (Android 7.1, ra32).
# Push to /sdcard/Android/data/com.retroarch.ra32/files/retroarch.cfg
# Per-core tweaks belong in overrides (config/<Core Name>/<Core Name>.cfg), not here.

# --- Video (Mali-400 / GLES 2.0) ---
video_driver = "gl"
video_vsync = "true"
video_threaded = "true"
video_smooth = "false"
video_aspect_ratio_auto = "false"
aspect_ratio_index = "1"
video_fullscreen = "true"
video_scale_integer = "false"
video_font_enable = "false"
fps_show = "false"

# --- Audio (HDMI is 48 kHz; cheapest resampler saves Cortex-A7 cycles) ---
audio_driver = "opensl"
audio_latency = "96"
audio_out_rate = "48000"
audio_resampler_quality = "1"

# --- Menu (rgui is the lightest driver on Mali-400) ---
menu_driver = "rgui"
menu_scale_factor = "1.000000"

# --- Input ---
input_autodetect_enable = "true"
input_joypad_driver = "android"
input_overlay_enable = "false"
input_overlay_enable_autopreferred = "false"
input_menu_toggle_gamepad_combo = "0"
quit_press_twice = "false"

# --- Paths ---
libretro_directory = "/data/data/com.retroarch.ra32/cores"
libretro_info_path = "/storage/emulated/0/RetroArch/info"
joypad_autoconfig_dir = "/storage/emulated/0/RetroArch/autoconfig"
system_directory = "/storage/emulated/0/RetroArch/system"
savefile_directory = "/storage/emulated/0/RetroArch/saves"
savestate_directory = "/storage/emulated/0/RetroArch/states"
rgui_browser_directory = "/storage/emulated/0/ROMs"
screenshot_directory = "/storage/emulated/0/RetroArch/screenshots"

# --- Core options: one shared file so the curated presets always apply ---
global_core_options = "true"
core_options_path = "/storage/emulated/0/Android/data/com.retroarch.ra32/files/retroarch-core-options.cfg"

# --- Cabinet / kiosk hardening ---
# Never persist accidental menu changes made by players.
config_save_on_exit = "false"
# Hides settings/core updater. Unlock: Main Menu -> "Disable Kiosk Mode" (asks the password).
# Set a password before deploying to a public cabinet.
kiosk_mode_enable = "true"
kiosk_mode_password = ""
menu_show_core_updater = "false"
menu_show_quit_retroarch = "false"
pause_nonactive = "true"

# --- Fewer NAND writes / less CPU ---
history_list_enable = "false"
savestate_thumbnail_enable = "false"
savestate_auto_save = "false"
savestate_auto_load = "false"
rewind_enable = "false"
run_ahead_enabled = "false"
log_verbosity = "false"
