# Curated core options for Cortex-A7 @ 1.2 GHz + Mali-400 (RK3229/RK322x).
# Push to /sdcard/Android/data/com.retroarch.ra32/files/retroarch-core-options.cfg
# (retroarch.cfg sets global_core_options = "true" and points core_options_path here).
#
# Option keys/values change between core versions. After the first launch of each
# core, open Quick Menu -> Core Options and confirm the values below were applied;
# unknown keys are ignored by RetroArch, never fatal.

# --- MAME 2003-Plus: boot straight into the game, no "press OK" screens ---
mame2003-plus_skip_disclaimer = "enabled"
mame2003-plus_skip_warnings = "enabled"

# --- FinalBurn Neo: lighter audio path on Cortex-A7 ---
fbneo-samplerate = "44100"
fbneo-sample-interpolation = "disabled"
fbneo-fm-interpolation = "disabled"

# --- PCSX ReARMed: dynarec on, expensive NEON enhancement off ---
pcsx_rearmed_drc = "enabled"
pcsx_rearmed_neon_enhancement_enable = "disabled"
pcsx_rearmed_neon_enhancement_no_main = "disabled"

# --- PicoDrive: dynarecs on ---
picodrive_drc = "enabled"
